# ─────────────────────────────────────────────────────────────────
# Nginx Reverse Proxy — OnChain Alpha Scanner
#
# Upstream: Next.js app container on port 3000 (internal network)
# Listens:  Port 80 (HTTP)
#
# For HTTPS / SSL:
#   1. Place fullchain.pem + privkey.pem in ./nginx/ssl/
#   2. Uncomment the HTTPS server block at the bottom of this file
#   3. The HTTP block will auto-redirect to HTTPS
# ─────────────────────────────────────────────────────────────────

upstream nextjs_app {
    server app:3000;
    keepalive 32;
}

# ── HTTP (port 80) ─────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;

    # Replace with your domain — e.g. scanner.coinxera.com
    server_name _;

    # ----- Uncomment this block to redirect HTTP → HTTPS -----
    # return 301 https://$host$request_uri;
    # ----------------------------------------------------------

    # Max upload size (for any future file upload features)
    client_max_body_size 10M;

    # Proxy all requests to the Next.js container
    location / {
        proxy_pass         http://nextjs_app;
        proxy_http_version 1.1;

        # WebSocket support (for Next.js dev HMR and any future ws features)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';

        # Proper forwarding headers so Next.js sees the real client IP
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        # Bypass cache for websocket upgrades
        proxy_cache_bypass $http_upgrade;

        # Deep scan can run up to 5 minutes — prevent 504 Gateway Timeout
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;

        # Buffer settings for large scan result payloads
        proxy_buffer_size        128k;
        proxy_buffers            4 256k;
        proxy_busy_buffers_size  256k;
    }

    # Health check endpoint — used by Docker and external uptime monitors
    location /api/health {
        proxy_pass         http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;   # Don't pollute logs with healthcheck noise
    }
}


