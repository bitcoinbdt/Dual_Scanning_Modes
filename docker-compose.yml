# ─────────────────────────────────────────────────────────────────
# OnChain Alpha Scanner — Production Docker Compose
#
# Usage:
#   docker compose up --build -d
#
# Requirements:
#   - Copy .env.docker.example → .env.docker and fill in real values
#   - For HTTPS, place certs in ./nginx/ssl/ and update nginx.conf
# ─────────────────────────────────────────────────────────────────

version: '3.9'

services:

  # ── Next.js Application ────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Pass NEXT_PUBLIC_ vars at build time so they get baked into the bundle
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
    container_name: onchain-scanner-app
    restart: unless-stopped
    # Runtime secrets (server-side only — never exposed to browser)
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: "3000"
    # Port 3000 is NOT published to the host — Nginx is the only entry point
    expose:
      - "3000"
    networks:
      - scanner-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s   # Give the Next.js cold start time to finish

  # ── Nginx Reverse Proxy ────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: onchain-scanner-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Main Nginx site config
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL certificates — place fullchain.pem + privkey.pem here for HTTPS
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - scanner-net

# ── Shared Network ─────────────────────────────────────────────
networks:
  scanner-net:
    driver: bridge
